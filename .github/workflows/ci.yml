name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - name: Typecheck
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Biome
        run: pnpm biome:check
      - name: Knip
        run: pnpm knip
      # git add -A first: a brand-new README the generator creates is untracked,
      # and plain `git diff --exit-code` would not see it.
      - name: Docs freshness
        run: |
          pnpm docs:generate
          git add -A
          git diff --cached --exit-code
      - name: Build
        run: pnpm build

  # The engines.node minimum, the previous LTS major and the current one.
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24", "26"]
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - name: Test
        run: pnpm test
