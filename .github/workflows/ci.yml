name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Only superseded PR runs are cancelled. Every other run gets its own group, so
# neither a pending master run nor a run called from a release is ever cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - name: Typecheck
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Biome
        run: pnpm biome:check
      - name: Knip
        run: pnpm knip
      # git add -A first: a brand-new README the generator creates is untracked,
      # and plain `git diff --exit-code` would not see it.
      - name: Docs freshness
        run: |
          pnpm docs:generate
          git add -A
          git diff --cached --exit-code
      - name: Build
        run: pnpm build

  # Ubuntu: the engines.node minimum, the previous LTS major and the current one.
  # Windows: the current major, since config paths and file permissions differ there.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22.12.0", "24", "26"]
        include:
          - os: windows-latest
            node: "26"
          - os: ubuntu-latest
            node: "26"
            coverage: true
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - name: Test
        if: ${{ !matrix.coverage }}
        run: pnpm test
      - name: Test with coverage
        if: ${{ matrix.coverage }}
        run: pnpm test:coverage
